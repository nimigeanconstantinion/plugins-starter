name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B verify

  claude-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [check-secrets, check-spring]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create local main from origin/main
        run: git branch --force main origin/main
      - uses: actions/checkout@v4
        with:
          repository: nimigeanconstantinion/plugins-store
          ref: v0.1.1
          token: ${{ secrets.PLUGINS_STORE_TOKEN || github.token }}
          path: .plugins-store
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.322
      - name: Review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bash .plugins-store/review.sh HEAD ${{ matrix.plugin }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verdict-${{ matrix.plugin }}
          path: |
            /tmp/verdict-${{ matrix.plugin }}.md
            /tmp/comments-${{ matrix.plugin }}.json

  claude-comment:
    needs: claude-review
    if: ${{ !cancelled() && needs.claude-review.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: verdict-*
          path: verdicts
          merge-multiple: true
      - name: Post review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          shopt -s nullglob
          md=(verdicts/*.md)
          js=(verdicts/*.json)
          if [ ${#md[@]} -gt 0 ]; then
            body=$(for f in "${md[@]}"; do cat "$f"; echo; done)
          else
            body="Niciun verdict generat."
          fi
          if [ ${#js[@]} -gt 0 ]; then
            jq -s 'add' "${js[@]}" > comments.json
          else
            echo '[]' > comments.json
          fi
          jq -n --arg body "$body" --arg sha "$SHA" --slurpfile c comments.json \
            '{commit_id: $sha, body: $body, event: "COMMENT", comments: $c[0]}' > review.json
          gh api --method POST "repos/$REPO/pulls/$PR/reviews" --input review.json \
            || gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body"
